spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/inventory_db}
    username: ${DB_USER:inventory_user}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/businesshub}
  cloud:
    openfeign:
      client:
        config:
          product-service:
            url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
            connect-timeout: 1000
            read-timeout: 3000

server:
  port: 8086

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  endpoint:
    health:
      show-details: always